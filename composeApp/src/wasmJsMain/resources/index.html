<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Literature — Card Game</title>
    <style>
        /* overscroll-behavior kills mobile pull-to-refresh — a one-swipe game killer. */
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14342b; overscroll-behavior-y: none; }
        #splash {
            position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
            gap: 14px; align-items: center; justify-content: center;
            color: #f5f5f0; font-family: -apple-system, system-ui, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1d4439 0%, #0f261f 100%);
        }
        #splash .suits { font-size: 34px; letter-spacing: 10px; color: #f2c14e; }
        #splash .spin {
            width: 26px; height: 26px; border: 3px solid rgba(255,255,255,0.25);
            border-top-color: #f2c14e; border-radius: 50%; animation: r 0.9s linear infinite;
        }
        @keyframes r { to { transform: rotate(360deg); } }
        #splash .fallback { display: none; max-width: 300px; text-align: center; line-height: 1.5; }
        #splash.failed .spin, #splash.failed .loading { display: none; }
        #splash.failed .fallback { display: block; }
        #splash .fallback p { margin: 0 0 18px; }
        /* block + auto margins, NOT inline-block: inline, the button flowed on with the last
           words of the sentence and left "rooms." stranded beside it. */
        #splash .fallback a {
            display: block; width: fit-content; margin: 0 auto; padding: 11px 20px;
            border-radius: 8px; background: #f2c14e; color: #14342b;
            font-weight: 600; text-decoration: none;
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#14342b">
    <!-- GA4 "Literature Web" stream; the app's Analytics facade no-ops until window.gtag exists. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EQR8K69SN9"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-EQR8K69SN9');
    </script>
    <script>
        // Compose for Web runs on WasmGC (Safari 18.2+, Chrome 119+). Without it composeApp.js
        // fails quietly and the splash below spins for ever — and invitees arrive here from
        // join.html, which promises "no install needed". Probe first, and keep a watchdog for
        // every other way the boot can die: a failed fetch, a parse error, an old WebView.
        (function () {
            var BOOTED = false;
            // A module whose type section declares a GC array type. Engines without WasmGC
            // reject it, so validate() is false.
            var GC_PROBE = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 4, 1, 0x5e, 0x78, 0]);

            function playUrl() {
                var room = "";
                try {
                    room = (new URLSearchParams(location.search).get("room") || "").trim();
                } catch (e) { /* older engines: no room code, still a valid link */ }
                var url = "https://play.google.com/store/apps/details?id=com.cards.game.literature";
                return room ? url + "&referrer=" + encodeURIComponent("room=" + room.toUpperCase()) : url;
            }

            function fail(reason) {
                if (BOOTED) return;
                var splash = document.getElementById("splash");
                if (!splash || splash.classList.contains("failed")) return;
                BOOTED = true;
                var note = splash.querySelector(".fallback");
                if (note) note.querySelector("a").setAttribute("href", playUrl());
                splash.classList.add("failed");
                if (window.gtag) window.gtag("event", "web_boot_failed", { reason: reason });
            }

            var supported = false;
            try { supported = WebAssembly.validate(GC_PROBE); } catch (e) { supported = false; }
            if (!supported) {
                document.addEventListener("DOMContentLoaded", function () { fail("no_wasm_gc"); });
                return;
            }

            window.addEventListener("error", function (e) {
                if (e && e.target && e.target.src) fail("script_error");
            }, true);
            window.addEventListener("unhandledrejection", function () { fail("rejected"); });

            // The app removes #splash once it has drawn. Still there after 20s means it never will.
            document.addEventListener("DOMContentLoaded", function () {
                setTimeout(function () {
                    if (document.getElementById("splash")) fail("timeout");
                }, 20000);
            });
        })();
    </script>
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
<div id="splash">
    <!-- U+FE0E pins text presentation: Android browsers otherwise render bare suits as
         fixed-color emoji (red hearts, near-invisible dark spades) instead of the gold CSS. -->
    <div class="suits">&spades;&#xFE0E; &hearts;&#xFE0E; &diams;&#xFE0E; &clubs;&#xFE0E;</div>
    <div class="loading">Dealing the cards&hellip;</div>
    <div class="spin"></div>
    <div class="fallback">
        <p>This browser can&rsquo;t run the web version &mdash; it needs Safari&nbsp;18.2 or
           Chrome&nbsp;119 and up. The Android app plays the same rooms.</p>
        <a href="https://play.google.com/store/apps/details?id=com.cards.game.literature">Get it on Google Play</a>
    </div>
</div>
</body>
</html>
