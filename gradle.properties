#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9 disallows com.android.application together with the KMP plugin unless the
# pre-9 integration is kept; drop these once composeApp migrates to AGP's built-in
# Kotlin / com.android.kotlin.multiplatform.* structure.
android.builtInKotlin=false
android.newDsl=false